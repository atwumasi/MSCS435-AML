<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Advanced Machine Learning course emblem</title>
<desc>A bold circular badge with a large central neural network connected by thick spokes to five chips representing computer vision, generative modeling, sequence modeling, natural language processing, and reinforcement learning.</desc>
<defs>
<style>
  .ring { fill: none; stroke: #26215C; stroke-width: 4; }
  .spoke-v { stroke: #7F77DD; stroke-width: 4; }
  .spoke-g { stroke: #D4537E; stroke-width: 4; }
  .spoke-s { stroke: #D85A30; stroke-width: 4; }
  .spoke-n { stroke: #EF9F27; stroke-width: 4; }
  .spoke-r { stroke: #5DCAA5; stroke-width: 4; }
  .loop { fill: none; stroke: #AFA9EC; stroke-width: 1.3; }
  .edge1 { stroke: #7F77DD; stroke-width: 2.5; fill: none; }
  .edge2 { stroke: #5DCAA5; stroke-width: 2.5; fill: none; }
  .node1 { fill: #534AB7; }
  .node2 { fill: #0F6E56; }
  .node3 { fill: #993C1D; }
  .icon { fill: none; stroke: #ffffff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .iconfill { fill: #ffffff; }
</style>
</defs>

<rect x="0" y="0" width="680" height="540" fill="#ffffff"/>

<circle cx="340" cy="270" r="215" class="ring"/>

<path class="loop" d="M340 95 L506 216 L443 412 L237 412 L174 216 Z"/>

<line x1="340" y1="270" x2="340" y2="95" class="spoke-g"/>
<line x1="340" y1="270" x2="506" y2="216" class="spoke-n"/>
<line x1="340" y1="270" x2="443" y2="412" class="spoke-s"/>
<line x1="340" y1="270" x2="237" y2="412" class="spoke-r"/>
<line x1="340" y1="270" x2="174" y2="216" class="spoke-v"/>

<!-- Vision chip -->
<circle cx="174" cy="216" r="34" fill="#534AB7"/>
<g transform="translate(174,216)">
  <rect x="-13" y="-13" width="10" height="10" rx="2" class="iconfill"/>
  <rect x="3" y="-13" width="10" height="10" rx="2" class="icon" stroke="#ffffff"/>
  <rect x="-13" y="3" width="10" height="10" rx="2" class="icon" stroke="#ffffff"/>
  <rect x="3" y="3" width="10" height="10" rx="2" class="iconfill"/>
</g>

<!-- Generative chip -->
<circle cx="340" cy="95" r="34" fill="#993556"/>
<path class="iconfill" d="M340 76 L346 90 L361 95 L346 100 L340 114 L334 100 L319 95 L334 90 Z"/>

<!-- NLP chip -->
<circle cx="506" cy="216" r="34" fill="#854F0B"/>
<path class="iconfill" d="M488 204 h36 a6 6 0 0 1 6 6 v14 a6 6 0 0 1 -6 6 h-20 l-10 9 v-9 h-6 a6 6 0 0 1 -6 -6 v-14 a6 6 0 0 1 6 -6 Z"/>

<!-- Sequence chip -->
<circle cx="443" cy="412" r="34" fill="#712B13"/>
<path class="icon" d="M420 412 Q428 398 436 412 T452 412 T468 412" stroke="#ffffff"/>

<!-- RL chip -->
<circle cx="237" cy="412" r="34" fill="#0F6E56"/>
<path class="iconfill" d="M224 396 L224 428 L250 412 Z"/>

<!-- central network -->
<path class="edge1" d="M280 225 L340 200"/>
<path class="edge1" d="M280 225 L340 245"/>
<path class="edge1" d="M280 270 L340 200"/>
<path class="edge1" d="M280 270 L340 245"/>
<path class="edge1" d="M280 270 L340 295"/>
<path class="edge1" d="M280 315 L340 245"/>
<path class="edge1" d="M280 315 L340 295"/>
<path class="edge1" d="M280 315 L340 340"/>

<path class="edge2" d="M340 200 L400 225"/>
<path class="edge2" d="M340 245 L400 225"/>
<path class="edge2" d="M340 245 L400 270"/>
<path class="edge2" d="M340 295 L400 270"/>
<path class="edge2" d="M340 295 L400 315"/>
<path class="edge2" d="M340 340 L400 315"/>

<circle cx="280" cy="225" r="11" class="node1"/>
<circle cx="280" cy="270" r="11" class="node1"/>
<circle cx="280" cy="315" r="11" class="node1"/>

<circle cx="340" cy="200" r="11" class="node2"/>
<circle cx="340" cy="245" r="11" class="node2"/>
<circle cx="340" cy="295" r="11" class="node2"/>
<circle cx="340" cy="340" r="11" class="node2"/>

<circle cx="400" cy="225" r="11" class="node3"/>
<circle cx="400" cy="270" r="11" class="node3"/>
<circle cx="400" cy="315" r="11" class="node3"/>
</svg>
